# AstrmiraVideo 生产编排（施工单 §9-3）
#
# 两个容器，职责严格分离：
#   app    —— 单进程 Fastify（/api + /media + 前端产物），**不映射任何宿主端口**：
#             必须经 Caddy 访问，避免出现"绕过 HTTPS 的明文入口"（PLAN §9-2 红线）。
#   caddy  —— 反向代理 + 自动 HTTPS，负责三件容易被漏掉的事（见 Caddyfile.* 内注）。
#
# 变量来源：本文件的 `${...}` 由 `--env-file <仓库根>/.env.deploy` 提供，
# 由 `scripts/deploy.mjs` 统一注入（不要手工 export，避免两份真相）。

name: astrmiravideo

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: astrmiravideo:latest
    restart: unless-stopped

    # .env.deploy 里的 VOLCANO_API_KEY / PUBLIC_API_TOKEN / CORS_ORIGINS 等在此注入容器。
    # ⚠️ 它只在服务器本地存在，不入镜像也不入 git（Step 5-AC3）。
    env_file:
      - ../.env.deploy

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      # 容器内固定路径，与下面的卷挂载严格对应
      DATA_DIR: /app/data
      OUTPUT_DIR: /app/outputs
      # 反代后 req.ip 的正确性：不设 1 时所有请求同 IP，防线 5 的冷却会退化成全局锁
      TRUST_PROXY: "1"

    volumes:
      # 运行时数据只走卷：镜像重建不丢任务库与成片（AC3：它们不进镜像）
      - ../data:/app/data
      - ../outputs:/app/outputs

    networks:
      - web

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        # 等 app 健康后再起代理：否则首访会拿到 502，容易被误判成"部署失败"
        condition: service_healthy

    ports:
      # 对外端口由用户提供（DEPLOY_HOST 里带的端口与此一致）
      - "${DEPLOY_PORT}:${DEPLOY_PORT}"
      # 80 必须留给 ACME 的 HTTP-01 挑战（有域名时自动签发证书用）
      - "80:80"

    environment:
      DEPLOY_HOST: ${DEPLOY_HOST}

    volumes:
      # TLS_MODE ∈ {domain, ip}，由 deploy.mjs 按 DEPLOY_HOST 是不是 IP 自动推断
      - ./Caddyfile.${TLS_MODE}:/etc/caddy/Caddyfile:ro
      # 证书与 Caddy 状态必须持久化，否则每次重启都重新签发（会撞 Let's Encrypt 速率限制）
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
