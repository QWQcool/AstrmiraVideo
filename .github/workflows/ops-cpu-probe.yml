# 一次性运维工作流：探测服务器 CPU / 内存 / ffmpeg 能力（评估 Remotion 服务端渲染可行性）。
# 用完即删。连接方式与 deploy job 一致（sshpass -f 密码文件）。

name: ops-cpu-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: 准备凭据与主机密钥
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          printf '%s' "$SSH_PASSWORD" | tr -d '\r\n' > /tmp/deploy-pass
          chmod 600 /tmp/deploy-pass
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 探测 CPU / 内存 / 容器资源
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          sshpass -f /tmp/deploy-pass ssh -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'echo "=== CPU 型号 ==="; lscpu | grep -E "Model name|^CPU\(s\)|Thread|Core|MHz" ; \
             echo "=== 核数 ==="; nproc; \
             echo "=== 内存 ==="; free -h; \
             echo "=== 容器内 ffmpeg ==="; docker compose --env-file /root/astrmira/.env.deploy -f /root/astrmira/deploy/compose.yaml exec -T app ffmpeg -version 2>/dev/null | head -1; \
             echo "=== 容器 CPU 限制 ==="; docker inspect $(docker compose --env-file /root/astrmira/.env.deploy -f /root/astrmira/deploy/compose.yaml ps -q app) --format "NanoCpus={{.HostConfig.NanoCpus}} Memory={{.HostConfig.Memory}}"; \
             echo "=== 当前负载 ==="; uptime'
