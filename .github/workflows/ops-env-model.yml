name: Ops · clean the model placeholder from .env.deploy

# ⚠️ 一次性运维工作流（**用完即删**，与上次查容器内 ffmpeg 版本的做法相同）。
#
# 为什么要借 runner：本机到服务器**只有 80/443 可达**（SSH 端口从本机探测全部超时），
# 而 runner → 服务器的入站连接是通的（CD 一直这么做）。
#
# 它做一件很小的事：把服务器 `.env.deploy` 里那行**假值**
# `VOLCANO_MODEL_NAME=doubao-seedance-video` 注释掉，然后重建容器使其生效。
# 背景见 PLAN §5「V8.3 批次 6」：V2.1 起"请求里的模型优先于 env"，界面用户已不受影响，
# 但**不带模型的 API 调用**仍会拿到这个占位符并被上游 404。
#
# 安全设计：先 `cp -a` 备份成 `.env.deploy.bak-<时间戳>`（服务器上留痕，便于回滚），
# 再幂等地注释（已注释的行不会二次处理）。

on:
  workflow_dispatch:

concurrency:
  # 与 CD 的 deploy job **同一组**：串行执行。
  # 否则"改 env 重启"会和"发新版本重启"撞在一起，留下难以归因的中间态。
  group: deploy-production
  cancel-in-progress: false

jobs:
  clean-model-env:
    runs-on: ubuntu-latest

    steps:
      - name: 安装 sshpass（与 CD 同一套最小依赖）
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: 准备凭据与主机密钥
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          # 与 CD 完全一致：先剥 CR/LF 再落盘（Secret 常带 CRLF，会让 sshpass 静默失败）
          printf '%s' "$SSH_PASSWORD" | tr -d '\r\n' > /tmp/deploy-pass
          chmod 600 /tmp/deploy-pass
          echo "密码文件长度: $(wc -c < /tmp/deploy-pass)"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 备份并注释占位符（幂等）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          sshpass -f /tmp/deploy-pass ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd /root/astrmira

          echo "── 改动前 ──"
          grep -n 'VOLCANO_MODEL_NAME' .env.deploy || echo '(该行不存在)'

          STAMP=$(date +%Y%m%d-%H%M%S)
          cp -a .env.deploy ".env.deploy.bak-${STAMP}"
          echo "已备份 → .env.deploy.bak-${STAMP}"

          # `#&` 表示"整行匹配内容前加 #"，对已注释的行不生效（幂等）
          sed -i 's|^VOLCANO_MODEL_NAME=|#&|' .env.deploy

          echo "── 改动后 ──"
          grep -n 'VOLCANO_MODEL_NAME' .env.deploy || echo '(该行不存在)'
          echo "── 备份列表（最近 3 个）──"
          ls -1t .env.deploy.bak-* | head -3
          REMOTE

      - name: 重建容器使其生效
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # 走项目自己的部署脚本（它负责推导 TLS_MODE / CORS / SNI 与 Basic Auth 哈希，
          # 手工 `docker compose up` 会漏掉这些推导值）
          sshpass -f /tmp/deploy-pass ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /root/astrmira && node scripts/deploy.mjs'

      - name: 验证（容器状态 / 容器内 env / 启动日志）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          sshpass -f /tmp/deploy-pass ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -e
          CONTAINER=$(docker ps --format '{{.Names}}' | grep -m1 astrmiravideo-app || true)
          echo "── 容器状态 ──"
          docker ps --format '{{.Names}} | {{.Status}}'
          echo "CONTAINER=${CONTAINER}"

          echo "── 容器内 VOLCANO_MODEL_NAME ──"
          VALUE=$(docker exec "$CONTAINER" printenv VOLCANO_MODEL_NAME || true)
          echo "值=[${VALUE}]（空即已清干净）"

          echo "── 启动日志里的占位符告警 ──"
          if docker logs --tail 300 "$CONTAINER" 2>&1 | grep -q '占位符'; then
            echo '✗ 仍出现占位符告警（改动未生效？）'
            docker logs --tail 300 "$CONTAINER" 2>&1 | grep '占位符' || true
            exit 1
          fi
          echo '✓ 未出现占位符告警'
          REMOTE
