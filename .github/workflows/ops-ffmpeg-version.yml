name: Ops · ffmpeg 版本自查（临时）

# ⚠️ 临时工作流（用完即删）：只为从**部署服务器上的容器**里读 ffmpeg / ffprobe 实际版本，
# 用于回填 docs/UPSTREAM.md 里那条【待验证】。
#
# 为什么必须借 CI 的通道：本机到服务器的 **SSH 端口不可达**（只放通了 80/443，
# 端口探测全部超时），而 runner → 服务器的连接是通的、且 Secret 里就有端口与口令。
#
# 只读：`docker exec … ffmpeg -version` / `dpkg -s`，不改变服务器与容器状态。
# 手动触发：`gh workflow run ops-ffmpeg-version.yml`；不绑 push / PR，因此不会影响 CD。

on:
  workflow_dispatch:

jobs:
  ffmpeg-version:
    runs-on: ubuntu-latest

    steps:
      - name: 安装 sshpass（密码认证的最小依赖）
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: 准备凭据与主机密钥
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          # 与 CD 同一口径：先剥 CR/LF 再落盘成 0600 文件（PowerShell 写入的 Secret 常带 CRLF）
          printf '%s' "$SSH_PASSWORD" | tr -d '\r\n' > /tmp/deploy-pass
          chmod 600 /tmp/deploy-pass
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 读取容器内 ffmpeg / ffprobe 版本（只读）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          sshpass -f /tmp/deploy-pass ssh -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'echo "== docker image =="; docker inspect --format "{{.Config.Image}} {{index .Config.Labels \"org.opencontainers.image.version\"}}" astrmiravideo-app-1 2>/dev/null || true; echo "== ffmpeg -version (head -3) =="; docker exec astrmiravideo-app-1 ffmpeg -version | head -3; echo "== ffprobe =="; docker exec astrmiravideo-app-1 ffprobe -version | head -1; echo "== dpkg =="; docker exec astrmiravideo-app-1 dpkg -s ffmpeg | grep -E "^(Version|Source|Homepage)"'
