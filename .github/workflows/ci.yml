name: CI

# CI 三件套（PLAN §6-D14 / PLAN §4 Step 2-AC8）：lint / type / test，外加契约层专项。
#
# 2026-10-22：自动触发已暂停（Actions 配额原因），当前只能手动 workflow_dispatch。
# 恢复自动的判断依据与具体改法见文件末尾注释。
#
# ⚠️ 关于 ffmpeg 与夹具片段（这两个都**不在仓库里**，必须由 runner 现场准备）：
# 1. ffmpeg 走系统安装（PLAN §6-D10 / UPSTREAM.md）：仓库与镜像都不内置二进制；
# 2. **夹具片段（tests/fixtures/clips/*.mp4）是 .gitignore 的** —— 二进制不入库，
#    由 `scripts/make-fixture-clips.mjs` 用 ffmpeg 现场合成。
#    漏掉第 2 步时，CI 会报 `ENOENT: copyfile .../tests/fixtures/clips/...`，
#    看起来像"测试自己坏了"，实际只是**输入没生成**（这一步曾经漏过，五个提交全红）。

on:
  # 2026-10-22：暂停自动 CI。原因：Free 计划私有仓库 2,000 分钟/月额度已用 90%
  #（本月 193 次运行 × 平均 478 秒 ≈ 1,530 分钟），剩余额度不足以再自动跑。
  # 改为按需手动触发：
  #   网页 → Actions → CI → Run workflow → 选择分支 main
  #   CLI  → gh workflow run CI --repo QWQcool/AstrmiraVideo --ref main -f deploy=false
  # 恢复自动需把 push / pull_request 加回来，见文末「恢复自动」。
  workflow_dispatch:
    inputs:
      deploy:
        description: '验证通过后部署到生产（还需仓库 Variable ENABLE_DEPLOY=1）'
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 刻意**不写** `version`：pnpm 版本由根 package.json 的 `packageManager` 提供。
      # 两处都写会直接失败（"Multiple versions of pnpm specified"）——
      # 而这正是单一事实源的意义：本地 / CI / 镜像三处都必须解析到同一个 pnpm。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 ffmpeg / ffprobe（夹具合成与产物校验必需）
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      # 必须在任何测试之前 —— 夹具片段是测试的**输入**，而它们不在仓库里
      - name: 合成夹具片段（二进制不入库，CI 现场生成）
        run: node scripts/make-fixture-clips.mjs

      - name: 契约包构建（backend / frontend 消费 dist 而非 src）
        run: pnpm --filter @astrmira/shared build

      - name: lint
        run: pnpm lint

      - name: type
        run: pnpm type

      # 契约层单跑一次：它是最快的整体反馈（几十毫秒），失败时不必等产物层那十几秒
      - name: 契约层测试
        run: pnpm test:contract

      # 全部测试 = 后端（含 `src/e2e/` 的真实 TCP 端到端：监听 + 206 Range + ffprobe）
      # + 前端（单测 + 视觉自检）。
      # CI 刻意走 `test:coverage` 而不是 `test`：这样**覆盖率门限与测试在同一趟内判定**，
      # 不必为覆盖率再跑一遍套件（键模块的文件级阈值见 backend/vitest.config.ts）。
      # 本地开发仍用 `pnpm test`（不插桩，更快）；要门限时用 `pnpm test:coverage`。
      - name: 全部测试（含覆盖率门限）
        run: pnpm test:coverage

      # ── 生产形态 UI 冒烟（PLAN §9-B9 的视觉固化项）──────────────────────────
      # 它测的是**浏览器里真的渲染出来了**：三栏骨架 / 首屏连通 / 字体自托管 /
      # 控制台零 error。以 NODE_ENV=production 起后端，因此**生产 CSP 是真的生效的**
      # —— 2026-09-22 正是这条抓到了「index.html 外链 Google Fonts 被 CSP 拦掉」的真实缺陷。
      # 与"截图基线比对"的取舍（不做像素比对）见 scripts/smoke-ui.mjs 头注释。
      - name: 构建产物（UI 冒烟需要 backend/dist 与 frontend/dist）
        run: pnpm build

      # 同时装 chromium 与 **chrome**：
      # - chromium：其余段落用（与历史一致）；
      # - chrome（Chrome for Testing）：浏览器端导出段落（[6f]/[6g]）**必需** ——
      #   开源 Chromium 构建不含 H.264 专有编解码器，WebCodecs 编码不可用，导出永远不出结果
      #   （2026-09-24 起 CI 一直红在这里，2026-10-08 定位；真实用户用的是 Chrome / Edge）。
      - name: 安装 chromium + chrome（UI 冒烟用）
        run: pnpm exec playwright install --with-deps chromium chrome

      - name: UI 冒烟（生产形态 + 控制台零 error）
        run: pnpm smoke:ui
        env:
          # 用 Chrome 跑冒烟 = 对着"真实用户浏览器能力"验（含 H.264 编码）
          SMOKE_CHANNEL: chrome

      # 截图只作留档（人看），不参与判定
      - name: 上传 UI 冒烟截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: artifacts/ui-smoke/
          if-no-files-found: ignore

  # ── CD：手动工作流验证通过后按开关发布到服务器（Step 5）──────────────────
  #
  # 设计取舍（都是刻意的）：
  # 1. `needs: verify` —— **只有 CI 通过才部署**，避免把红着的代码送上线；
  # 2. 只在手动 workflow_dispatch 且勾选 `deploy` 时部署 —— 默认 false，避免只想验证时误发布；
  # 3. `concurrency` 且 `cancel-in-progress: false` —— 串行，且**不取消进行中的部署**
  #    （半途取消会留下解压完但没重启的中间态，比排队更糟）；
  # 4. 代码靠 **scp/ssh 主动推送**而不是让服务器 `git pull` —— 实测目标服务器
  #    **访问不了 github.com**（15 秒超时），但 runner → 服务器的入站连接是通的，
  #    方向反过来就行；
  # 5. 服务器上**本地构建镜像**（而不是推 registry）—— 服务器能访问 docker.io / npm /
  #    Debian 镜像，8G 内存足够，避免每次往 registry 推 ~1.5GB；
  # 6. 健康检查查**容器状态**而不是 HTTP —— 容器内的 HEALTHCHECK 走 127.0.0.1:3000
  #    不经反代，不受站点登录影响，是最干净的判据。
  #
  # ⚠️ 认证方式：**密码**（`sshpass -e`，密码经环境变量传入，不进命令行）。
  # 曾经尝试过 ed25519 密钥（`SSH_PRIVATE_KEY`），但 runner 上 `ssh-keygen -y` 能解析
  # 同一份文件、`ssh` 却报 `Load key ...: error in libcrypto`，且换 base64 传输、剥 CR、
  # 加 `IdentitiesOnly` 都无效。与其继续在这条路上试，不如用未知最少的方案。
  # 想改回密钥时，只需替换下面两步的连接方式，其余逻辑不用动。
  deploy:
    needs: verify
    # 2026-10-22：触发器改为 workflow_dispatch 后 event_name 不再是 push，
    # 原条件会让本 job 永久跳过；改为读取手动触发的 deploy 开关。
    # 仍需仓库 Variable ENABLE_DEPLOY=1；默认 false，避免“只想验证”时误部署。
    if: vars.ENABLE_DEPLOY == '1' && github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 2026-10-20：主机不可达时 scp 曾挂 14+ 分钟；给整个部署一个上限，别让一次手动部署卡住一整天
    # 2026-10-21：端口 29598 已确认可达；19MB 包跨境上传在 90s 内没传完（exit 124），放宽到 30 分钟总上限
    timeout-minutes: 30

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # ⚠️ 产物必须写到**工作区之外**（/tmp）。写到 `.` 里会变成"打包时往被打包的目录里写"，
      # tar 随即报 `file changed as we read it` 并以退出码 1 结束 —— 看起来像 tar 坏了，
      # 实际只是输出文件落在了输入目录内。
      - name: 打包（与 .dockerignore 同一套排除口径）
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --exclude=./.git \
            --exclude=./.env \
            --exclude=./.env.deploy \
            --exclude=./node_modules \
            --exclude=./backend/node_modules \
            --exclude=./frontend/node_modules \
            --exclude=./packages/shared/node_modules \
            --exclude=./backend/dist \
            --exclude=./frontend/dist \
            --exclude=./packages/shared/dist \
            --exclude=./data \
            --exclude=./outputs \
            --exclude=./tests/fixtures/clips \
            --exclude=./docs .
          ls -lh /tmp/deploy.tar.gz

      - name: 安装 sshpass（密码认证的最小依赖）
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: 准备凭据与主机密钥
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          # ⚠️ 先剥掉 CR/LF 再落盘，**只做一次**，后续步骤一律 `sshpass -f` 读这个文件。
          # 不这样做的话：Secret 值末尾常带 CRLF（用 PowerShell 管道写 `gh secret set` 必带），
          # 而 sshpass 会把整个值当密码送出去，服务端只回一句
          # `Permission denied, please try again.` —— 看起来像密码错了，实际是多了两个字节。
          printf '%s' "$SSH_PASSWORD" | tr -d '\r\n' > /tmp/deploy-pass
          chmod 600 /tmp/deploy-pass
          echo "密码文件长度: $(wc -c < /tmp/deploy-pass)"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # accept-new：首次连接自动接受主机密钥，同时保留后续的变更检测
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 上传代码包
        timeout-minutes: 7
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # -f：从文件读密码，因此密码**不会出现在进程命令行**里
          # 外层 timeout 是硬上限：主机能建 TCP 但不回包时，ssh 选项仍可能等很久
          # 2026-10-21：19MB 包跨境上传 90s 不够（exit 124），放宽到 420s；SFTP 本身已实测可用
          timeout 420s sshpass -f /tmp/deploy-pass scp -P "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            /tmp/deploy.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/root/astrmira/deploy.tar.gz"

      - name: 远程解压并部署
        timeout-minutes: 12
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          timeout 600s sshpass -f /tmp/deploy-pass ssh -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -e; cd /root/astrmira; rm -rf /root/astrmira.deploy-next; mkdir /root/astrmira.deploy-next; tar -xzf deploy.tar.gz -C /root/astrmira.deploy-next; rsync -a --delete --exclude=.git/ --exclude=.env.deploy --exclude=".env.deploy.bak-*" --exclude=data/ --exclude=outputs/ --exclude=generated-images/ --exclude=node_modules/ --exclude=.deploy-next/ /root/astrmira.deploy-next/ ./; rm -rf /root/astrmira.deploy-next; rm -f deploy.tar.gz; node scripts/deploy.mjs'

      - name: 健康检查（容器状态）
        timeout-minutes: 3
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          timeout 60s sshpass -f /tmp/deploy-pass ssh -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'docker ps --format "{{.Names}} | {{.Status}}"'

# ── 恢复自动（2026-11-01 额度重置后再考虑，本次不做）────────────────────────
# 恢复前先确认：
#   1. 本月 Actions 用量与剩余额度足够；
#   2. 默认分支上的 workflow_dispatch 已验证可用；
#   3. 再决定是否恢复「轻量自动车道」。
#
# 轻量车道建议（只作为以后改法，当前不生效）：
# on:
#   push:
#     branches: [main]
#     paths-ignore:
#       - '**.md'
#       - 'docs/**'
#       - '.gitignore'
#   pull_request:
#   workflow_dispatch:
#     inputs:
#       deploy:
#         description: '验证通过后部署到生产'
#         type: boolean
#         default: false
#
# concurrency:
#   group: ci-${{ github.ref }}
#   cancel-in-progress: true
#
# 注意：deploy job 自己的 concurrency: deploy-production / cancel-in-progress: false
# 是刻意的（半途取消会留下部署中间态），不要改成可取消。
# 恢复自动后仍要保留手动入口，并继续按“功能收尾 / 合并前 / 部署前”节奏跑，不要每次提交都跑。
