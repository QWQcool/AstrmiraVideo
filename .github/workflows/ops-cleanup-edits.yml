# 一次性运维工作流：清理线上的剪辑产物（V9 修复 2026-09-24 的线上数据收尾）。
#
# 用法：GitHub → Actions → ops-cleanup-edits → Run workflow
#   - confirm=false（默认）：dry-run，只列出线上有多少剪辑任务，不删
#   - confirm=true        ：真删（任务记录 + 成片文件 + 孤儿幂等键）
#
# 连接方式与 deploy job 一致（sshpass -f 密码文件，见 ci.yml 的注释）。
# **用完即删**：清理完成后这个文件应从仓库移除（它不属产品功能）。

name: ops-cleanup-edits

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'true = 真删；false = 只列出（dry-run）'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 sshpass（密码认证的最小依赖）
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: 准备凭据与主机密钥
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          # 先剥掉 CR/LF 再落盘（Secret 值末尾常带 CRLF，sshpass 会把它当密码的一部分）
          printf '%s' "$SSH_PASSWORD" | tr -d '\r\n' > /tmp/deploy-pass
          chmod 600 /tmp/deploy-pass
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 上传清理脚本到服务器
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          sshpass -f /tmp/deploy-pass scp -P "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            scripts/ops/cleanup-edits.cjs "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cleanup-edits.cjs"

      - name: 拷进容器并执行（dry-run 或真删）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          CONFIRM_FLAG=""
          if [ "$CONFIRM" = "true" ]; then CONFIRM_FLAG="--confirm"; fi
          echo "模式：$([ -n "$CONFIRM_FLAG" ] && echo '真删' || echo 'dry-run')"
          sshpass -f /tmp/deploy-pass ssh -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /root/astrmira && \
             CONTAINER=\$(docker compose --env-file .env.deploy -f deploy/compose.yaml ps -q app) && \
             echo \"容器: \$CONTAINER\" && \
             docker cp /tmp/cleanup-edits.cjs \"\$CONTAINER:/app/backend/cleanup-edits.cjs\" && \
             docker compose --env-file .env.deploy -f deploy/compose.yaml exec -T app \
               node backend/cleanup-edits.cjs $CONFIRM_FLAG; \
             docker compose --env-file .env.deploy -f deploy/compose.yaml exec -T app \
               rm -f backend/cleanup-edits.cjs"
