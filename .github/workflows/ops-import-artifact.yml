name: Ops · import a smoke artifact into the live gallery

# ⚠️ 一次性运维工作流（**用完即删**）。
#
# 背景：本机到服务器只有 80/443 可达（SSH 不通），二进制没法直接推上去；
# 于是先把成片经 `/api/upload` 当作**参考资产**送上服务器（合法通道，≤20MB），
# 再由这个工作流把它**改名成成片**、用容器内的 ffmpeg 抽封面、并写一条任务记录
# —— 于是它和线上真实出片的产物长得完全一样，出现在画廊里。
#
# 它**不重新生成、不花钱**：只是把已经在服务器上的那份文件挪到正确位置并登记。
# 记录里的 `message` 会如实写明这是导入的冒烟产物，不含糊。

on:
  workflow_dispatch:

concurrency:
  # 与 CD 同一组：串行，避免与发布互踩
  group: deploy-production
  cancel-in-progress: false

jobs:
  import-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: 安装 sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: 准备凭据与主机密钥
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          printf '%s' "$SSH_PASSWORD" | tr -d '\r\n' > /tmp/deploy-pass
          chmod 600 /tmp/deploy-pass
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 导入（改名 + 抽封面 + 写库）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          sshpass -f /tmp/deploy-pass ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd /root/astrmira

          CONTAINER=$(docker ps --format '{{.Names}}' | grep -m1 astrmiravideo-app || true)
          echo "app 容器：${CONTAINER}"

          # ① 找到刚上传的那个资产（最新一个 mp4）
          ASSET=$(ls -1t outputs/assets/*.mp4 2>/dev/null | head -1 || true)
          if [ -z "$ASSET" ]; then
            echo '✗ 没找到 outputs/assets/*.mp4 —— 请先通过 /api/upload 把成片传上来'
            exit 1
          fi
          echo "找到资产：${ASSET}（$(stat -c%s "$ASSET") 字节）"

          TASK_ID=$(cat /proc/sys/kernel/random/uuid)
          echo "分配 taskId：${TASK_ID}"

          # ② 挪成"成片"，并删掉那份临时资产（避免同一份文件在库里出现两次）
          cp -a "$ASSET" "outputs/${TASK_ID}.mp4"
          rm -f "$ASSET"

          # ③ 抽封面：用容器内的 ffmpeg（与 pipeline/thumbnail.ts 同一套路，宽 480）
          mkdir -p outputs/thumbs
          docker exec "$CONTAINER" ffmpeg -y -loglevel error \
            -i "/app/outputs/${TASK_ID}.mp4" \
            -frames:v 1 -vf scale=480:-2 -q:v 3 \
            "/app/outputs/thumbs/${TASK_ID}.jpg"
          ls -l "outputs/${TASK_ID}.mp4" "outputs/thumbs/${TASK_ID}.jpg"

          # ④ 写一条任务记录（用 python3 标准库的 sqlite3 —— 不在服务器上装任何东西）
          if ! command -v python3 >/dev/null 2>&1; then
            echo '✗ 服务器没有 python3，无法写库（文件已就位，记录未登记）'
            exit 1
          fi

          python3 - "$TASK_ID" <<'PY'
          import json, sqlite3, sys, time

          task_id = sys.argv[1]
          prompt = (
              '广告片：一盏现代极简风台灯的产品广告。\n'
              '镜头一（0-1.5s）：漆黑的卧室书桌，只有窗外城市霓虹的冷蓝余光；台灯静置在桌面，金属灯臂反射出微弱光点。\n'
              '镜头二（1.5-3s）：手指轻触灯座开关，暖金色灯光从灯罩内向外层层铺开，照亮书桌木纹、翻开的书页与一杯冒着热气的茶，桌面影子向四周缓缓拉开（丁达尔光束可见）。\n'
              '镜头三（3-5s）：低角度缓慢环绕推近，掠过灯罩的柔光扩散纹理与磨砂金属质感，背景暖光虚化成温柔光斑，画面定格在灯与暖光构成的舒适角落。\n'
              '质感：广告大片，2700K 暖光与冷蓝环境光的对比，浅景深，微距质感，画面干净稳定，无文字无字幕。'
          )
          snapshot = {
              'prompt': prompt,
              'mode': 't2v',
              'aspectRatio': '16:9',
              'resolution': {'width': 1280, 'height': 720},
              'params': {'durationSec': 5},
              'provider': 'cloud-volcano-seedance',
              'options': {
                  'model': 'doubao-seedance-2-0-mini-260615',
                  'baseUrl': 'https://ark.cn-beijing.volces.com/api/v3',
                  'seedanceWatermark': False,
              },
          }

          db = sqlite3.connect('/root/astrmira/data/app.db')
          now = int(time.time() * 1000)
          db.execute(
              'INSERT INTO tasks (task_id, track, provider, status, progress_percent, request_snapshot,'
              ' output_video_url, thumbnail_url, warnings, error, upstream_task_id, submitting, message,'
              ' created_at, updated_at)'
              ' VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)',
              (
                  task_id,
                  'cloud',
                  'cloud-volcano-seedance',
                  'succeeded',
                  100,
                  json.dumps(snapshot, ensure_ascii=False),
                  f'/media/{task_id}.mp4',
                  f'/media/thumbs/{task_id}.jpg',
                  None,
                  None,
                  'imported-smoke-artifact',
                  0,
                  '上游生成完成（本机真机冒烟产物，由运维导入线上画廊）',
                  now,
                  now,
              ),
          )
          db.commit()
          row = db.execute(
              'SELECT task_id, status, progress_percent, output_video_url, thumbnail_url, message'
              ' FROM tasks WHERE task_id = ?',
              (task_id,),
          ).fetchone()
          db.close()
          print('已登记：', row)
          PY

          echo "✓ 导入完成：${TASK_ID}"
          REMOTE
